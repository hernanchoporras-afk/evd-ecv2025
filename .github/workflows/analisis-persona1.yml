name: ECV 2025 - Inferencia Persona 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'codigo/**'
      - 'datos/**'
      - '.github/workflows/analisis-persona1.yml'

permissions:
  contents: read

jobs:
  ejecutar-analisis:
    name: Reconstruir Parte 1 e inferencia
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Instalar dependencias
        shell: Rscript {0}
        run: |
          install.packages('survey', repos = getOption('repos'))
          stopifnot(requireNamespace('survey', quietly = TRUE))

      - name: Verificar los archivos requeridos
        shell: bash
        run: |
          test -d datos || { echo 'Falta la carpeta datos/'; exit 1; }
          test -f codigo/ejecutar_persona1.R || { echo 'Falta el script principal'; exit 1; }
          echo 'Archivos disponibles en datos/:'
          ls -lh datos/

      - name: Ejecutar las dos partes del analisis
        shell: bash
        run: Rscript --vanilla codigo/ejecutar_persona1.R

      - name: Publicar tablas y figuras como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ecv2025-persona1
          path: |
            resultados/
            figuras/
          retention-days: 30
          if-no-files-found: warn
